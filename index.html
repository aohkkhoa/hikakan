<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random chữ Nhật</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f4f8;
      margin: 0;
    }

    .wrap {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .output {
      margin: 20px 0;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 8px;
      color: #2b6cb0;
      white-space: pre-line;
    }

    .answer {
      margin: 10px 0;
      font-size: 22px;
      font-weight: bold;
      color: #e63946;
      display: none;
      white-space: pre-line;
    }

    #options {
      margin-bottom: 20px;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 0;
    }

    #checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
      margin-bottom: 15px;
    }

    #controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      /* Giảm khoảng cách một chút cho hợp lý */
      flex-wrap: wrap;
      flex-direction: column;
      /* Thêm dòng này */
    }

    #charCount {
      width: 60px;
      padding: 5px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .btns {
      display: flex;
      justify-content: center;
      align-content: center;
      flex-wrap: wrap;
      gap: 10px;
      flex-direction: column;
      /* Thêm dòng này */

    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2b6cb0;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1a4f80;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Random chữ Nhật</h1>
    <p>Bấm Space để chọn chữ, Enter để xem đáp án.</p>

    <div id="options">
      <div id="checkboxes">
        <!-- Checkboxes will be generated by JS -->
      </div>
      <div id="controls">
        <div>
          <button id="selectAllBtn" type="button">Chọn tất cả</button>
          <button id="deselectAllBtn" type="button">Bỏ chọn tất cả</button>
        </div>
        <label for="charCount">Số chữ cần kiểm tra:
          <input type="number" id="charCount" value="6" min="1" max="46">
        </label>
      </div>
    </div>

    <div id="modeDisplay" style="margin-bottom:10px; font-weight:bold; color:#444;">
      🅰️ Chế độ: Romaji → Nhật
    </div>

    <div id="output" class="output">---</div>
    <div id="answer" class="answer">Đáp án: </div>

    <div class="btns">
      <button id="modeBtn" type="button">Chuyển sang Nhật → Romaji</button>
      <div>
        <button id="btn" type="button">Chọn chữ (Space)</button>
        <button id="ansBtn" type="button">Hiển thị đáp án (Enter)</button>
      </div>

    </div>
  </div>

  <script>
    const letterRows = [
      {
        name: 'あ行', chars: [
          { romaji: 'a', hira: 'あ', kata: 'ア' }, { romaji: 'i', hira: 'い', kata: 'イ' }, { romaji: 'u', hira: 'う', kata: 'ウ' }, { romaji: 'e', hira: 'え', kata: 'エ' }, { romaji: 'o', hira: 'お', kata: 'オ' }
        ]
      },
      {
        name: 'か行', chars: [
          { romaji: 'ka', hira: 'か', kata: 'カ' }, { romaji: 'ki', hira: 'き', kata: 'キ' }, { romaji: 'ku', hira: 'く', kata: 'ク' }, { romaji: 'ke', hira: 'け', kata: 'ケ' }, { romaji: 'ko', hira: 'こ', kata: 'コ' }
        ]
      },
      {
        name: 'さ行', chars: [
          { romaji: 'sa', hira: 'さ', kata: 'サ' }, { romaji: 'shi', hira: 'し', kata: 'シ' }, { romaji: 'su', hira: 'す', kata: 'ス' }, { romaji: 'se', hira: 'せ', kata: 'セ' }, { romaji: 'so', hira: 'そ', kata: 'ソ' }
        ]
      },
      {
        name: 'た行', chars: [
          { romaji: 'ta', hira: 'た', kata: 'タ' }, { romaji: 'chi', hira: 'ち', kata: 'チ' }, { romaji: 'tsu', hira: 'つ', kata: 'ツ' }, { romaji: 'te', hira: 'て', kata: 'テ' }, { romaji: 'to', hira: 'と', kata: 'ト' }
        ]
      },
      {
        name: 'な行', chars: [
          { romaji: 'na', hira: 'な', kata: 'ナ' }, { romaji: 'ni', hira: 'に', kata: 'ニ' }, { romaji: 'nu', hira: 'ぬ', kata: 'ヌ' }, { romaji: 'ne', hira: 'ね', kata: 'ネ' }, { romaji: 'no', hira: 'の', kata: 'ノ' }
        ]
      },
      {
        name: 'は行', chars: [
          { romaji: 'ha', hira: 'は', kata: 'ハ' }, { romaji: 'hi', hira: 'ひ', kata: 'ヒ' }, { romaji: 'fu', hira: 'ふ', kata: 'フ' }, { romaji: 'he', hira: 'へ', kata: 'ヘ' }, { romaji: 'ho', hira: 'ほ', kata: 'ホ' }
        ]
      },
      {
        name: 'ま行', chars: [
          { romaji: 'ma', hira: 'ま', kata: 'マ' }, { romaji: 'mi', hira: 'み', kata: 'ミ' }, { romaji: 'mu', hira: 'む', kata: 'ム' }, { romaji: 'me', hira: 'め', kata: 'メ' }, { romaji: 'mo', hira: 'も', kata: 'モ' }
        ]
      },
      {
        name: 'や行', chars: [
          { romaji: 'ya', hira: 'や', kata: 'ヤ' }, { romaji: 'yu', hira: 'ゆ', kata: 'ユ' }, { romaji: 'yo', hira: 'よ', kata: 'ヨ' }
        ]
      },
      {
        name: 'ら行', chars: [
          { romaji: 'ra', hira: 'ら', kata: 'ラ' }, { romaji: 'ri', hira: 'り', kata: 'リ' }, { romaji: 'ru', hira: 'る', kata: 'ル' }, { romaji: 're', hira: 'れ', kata: 'レ' }, { romaji: 'ro', hira: 'ろ', kata: 'ロ' }
        ]
      },
      {
        name: 'わ行', chars: [
          { romaji: 'wa', hira: 'わ', kata: 'ワ' }, { romaji: 'wo', hira: 'を', kata: 'ヲ' }
        ]
      },
      {
        name: 'ん', chars: [
          { romaji: 'n', hira: 'ん', kata: 'ン' }
        ]
      }
    ];

    let currentPicked = [];
    let mode = 'romajiToJapan'; // hoặc 'japanToRomaji'

    function renderOptions() {
      const container = document.getElementById('checkboxes');
      letterRows.forEach((row, index) => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = index;
        checkbox.className = 'row-checkbox';
        checkbox.checked = true; // Mặc định chọn tất cả
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(` ${row.name}`));
        container.appendChild(label);
      });
    }

    function pickRandom(arr, count) {
      const copy = [...arr];
      const result = [];
      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * copy.length);
        result.push(copy[idx]);
        copy.splice(idx, 1);
      }
      return result;
    }

    function pickLetters() {
      const selectedCheckboxes = document.querySelectorAll('.row-checkbox:checked');
      let sourceLetters = [];
      selectedCheckboxes.forEach(checkbox => {
        const rowIndex = parseInt(checkbox.value, 10);
        sourceLetters.push(...letterRows[rowIndex].chars);
      });

      if (sourceLetters.length === 0) {
        document.getElementById('output').textContent = 'Vui lòng chọn ít nhất một hàng chữ cái.';
        document.getElementById('answer').style.display = 'none';
        return;
      }

      const countInput = document.getElementById('charCount');
      const desiredCount = parseInt(countInput.value, 10) || 6;
      const result = pickRandom(sourceLetters, Math.min(desiredCount, sourceLetters.length));
      currentPicked = result;
      const out = document.getElementById('output');
      const ans = document.getElementById('answer');
      ans.style.display = 'none';

      if (mode === 'romajiToJapan') {
        // Hiển thị 3 chữ Romaji
        out.textContent = result.map(r => r.romaji).join('   ');
      } else {
        // Hiển thị 10 chữ Nhật (5 trên, 5 dưới) — trộn giữa hira và kata
        const mix = result.map(r => (Math.random() < 0.5 ? r.hira : r.kata));
        const mid = Math.ceil(mix.length / 2);
        const top = mix.slice(0, mid).join(' ');
        const bottom = mix.slice(mid).join(' ');
        out.innerHTML = `${top}<br>${bottom}`;
      }

      document.getElementById('btn').blur();
    }

    function showAnswer() {
      if (currentPicked.length === 0) return;
      const ans = document.getElementById('answer');
      let text = '';

      if (mode === 'romajiToJapan') {
        const hira = currentPicked.map(r => r.hira).join(' ');
        const kata = currentPicked.map(r => r.kata).join(' ');
        text = 'Đáp án:\nHiragana: ' + hira + '\nKatakana: ' + kata;
      } else {
        // Chia romaji 5 trên, 5 dưới, có dấu gạch để dễ nhìn
        const romaji = currentPicked.map(r => r.romaji);
        const mid = Math.ceil(romaji.length / 2);
        const top = romaji.slice(0, mid).join(' _ ');
        const bottom = romaji.slice(mid).join(' _ ');
        text = `Đáp án:\n${top}\n${bottom}`;
      }

      ans.textContent = text;
      ans.style.display = 'block';
      document.getElementById('ansBtn').blur();
    }

    // Nút chuyển chế độ
    document.getElementById('modeBtn').addEventListener('click', () => {
      const modeText = document.getElementById('modeDisplay');
      if (mode === 'romajiToJapan') {
        mode = 'japanToRomaji';
        modeText.textContent = '🇯🇵 Chế độ: Nhật → Romaji';
        document.getElementById('modeBtn').textContent = 'Chuyển sang Romaji → Nhật';
      } else {
        mode = 'romajiToJapan';
        modeText.textContent = '🅰️ Chế độ: Romaji → Nhật';
        document.getElementById('modeBtn').textContent = 'Chuyển sang Nhật → Romaji';
      }
      document.getElementById('output').textContent = '---';
      document.getElementById('answer').style.display = 'none';
    });

    // Nút chọn/bỏ chọn tất cả
    document.getElementById('selectAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = true);
    });

    document.getElementById('deselectAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
    });

    // Render các lựa chọn khi tải trang
    document.addEventListener('DOMContentLoaded', renderOptions);

    // Sự kiện click các nút
    document.getElementById('btn').addEventListener('click', (e) => {
      e.preventDefault();
      pickLetters();
    });

    document.getElementById('ansBtn').addEventListener('click', (e) => {
      e.preventDefault();
      showAnswer();
    });

    // Sự kiện bàn phím
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        pickLetters();
      } else if (e.code === 'Enter') {
        e.preventDefault();
        showAnswer();
      }
    });
  </script>
</body>

</html>
